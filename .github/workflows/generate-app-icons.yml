name: Generate dashboard app icons

on:
  push:
    paths:
      - '.github/workflows/generate-app-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate PWA icons and manifest
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, re

          images = Path('Images')
          source = images / 'app-icon.png'
          if not source.exists():
              raise SystemExit('Images/app-icon.png was not found')

          src = Image.open(source).convert('RGBA')
          navy = (0, 26, 56, 255)

          def regular(size, filename):
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(images / filename, optimize=True)

          def maskable(size, filename):
              canvas = Image.new('RGBA', (size, size), navy)
              safe = int(size * 0.80)
              icon = src.resize((safe, safe), Image.Resampling.LANCZOS)
              pos = ((size - safe) // 2, (size - safe) // 2)
              canvas.alpha_composite(icon, pos)
              canvas.save(images / filename, optimize=True)

          regular(192, 'app-icon-192.png')
          regular(512, 'app-icon-512.png')
          maskable(192, 'app-icon-maskable-192.png')
          maskable(512, 'app-icon-maskable-512.png')

          manifest = {
              'id': './admin.html',
              'name': 'Dashboard',
              'short_name': 'Dashboard',
              'description': 'Admin dashboard',
              'start_url': './admin.html',
              'scope': './',
              'display': 'standalone',
              'display_override': ['standalone', 'minimal-ui'],
              'background_color': '#001a38',
              'theme_color': '#001a38',
              'icons': [
                  {'src': 'Images/app-icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
                  {'src': 'Images/app-icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
                  {'src': 'Images/app-icon-maskable-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'maskable'},
                  {'src': 'Images/app-icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'}
              ]
          }
          Path('dashboard.webmanifest').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          admin = Path('admin.html')
          if admin.exists():
              text = admin.read_text(encoding='utf-8')
              text = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" sizes="192x192" href="Images/app-icon-192.png">', text, count=1)
              text = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="192x192" href="Images/app-icon-192.png">', text, count=1)
              if 'rel="manifest"' not in text:
                  text = text.replace('</head>', '<link rel="manifest" href="dashboard.webmanifest">\n</head>', 1)
              admin.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/app-icon-192.png Images/app-icon-512.png Images/app-icon-maskable-192.png Images/app-icon-maskable-512.png dashboard.webmanifest admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix dashboard PWA app icons"
          git push origin main
