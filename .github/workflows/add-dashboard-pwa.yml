name: Add Dashboard web app support

on:
  push:
    paths:
      - '.github/scripts/patch_dashboard_pwa.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update admin PWA metadata
        run: python3 .github/scripts/patch_dashboard_pwa.py
      - name: Commit admin update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Make Dashboard installable as a web app"
          git push origin main
