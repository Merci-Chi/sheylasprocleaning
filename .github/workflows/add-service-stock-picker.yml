name: Add service stock image picker

on:
  push:
    paths:
      - '.github/scripts/patch_service_picker.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update admin
        run: python3 .github/scripts/patch_service_picker.py
      - name: Commit admin update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Add 20 service stock image choices"
          git push origin main
