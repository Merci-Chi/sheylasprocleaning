// Traducción individual de reseñas con Google Translate.
function abrirResenaEnGoogleTranslate(id){
  const review=data.reviews.find(item=>item.id===id),text=String(review?.body||'').trim();
  if(!text)return toast('This review has no text to translate');
  const url='https://translate.google.com/?sl=auto&tl=es&text='+encodeURIComponent(text)+'&op=translate';
  window.open(url,'_blank','noopener,noreferrer');
}
const renderReviewRowsSinGoogle=renderReviewRows;
renderReviewRows=function(){
  renderReviewRowsSinGoogle();
  document.querySelectorAll('#reviewRows tbody tr').forEach(row=>{
    const cell=row.children[2];
    if(!cell||cell.querySelector('.review-snippet'))return;
    const text=cell.textContent.trim(),snippet=document.createElement('span');
    snippet.className='review-snippet';snippet.textContent=text;snippet.title=text;
    cell.textContent='';cell.appendChild(snippet);
  });
  document.querySelectorAll('[data-review-open]').forEach(viewButton=>{
    const actions=viewButton.closest('.row-actions');
    if(!actions||actions.querySelector('[data-review-translate]'))return;
    const button=document.createElement('button');
    button.type='button';button.className='ghost';button.dataset.reviewTranslate=viewButton.dataset.reviewOpen;
    button.innerHTML='<i class="fa-brands fa-google"></i> Translate';
    button.setAttribute('aria-label','Translate this review with Google');
    button.onclick=()=>abrirResenaEnGoogleTranslate(button.dataset.reviewTranslate);
    actions.insertBefore(button,viewButton);
  });
};
const openReviewDetailSinGoogle=openReviewDetail;
openReviewDetail=function(id){
  openReviewDetailSinGoogle(id);
  const actions=overlay.querySelector('.modal-actions');
  if(!actions||actions.querySelector('[data-google-translate]'))return;
  const button=document.createElement('button');
  button.type='button';button.className='ghost';button.dataset.googleTranslate=id;
  button.innerHTML='<i class="fa-brands fa-google"></i> Translate with Google';
  button.onclick=()=>abrirResenaEnGoogleTranslate(id);
  actions.insertBefore(button,actions.firstChild);
};

  .appointment-day{border-radius:17px}.appointment-day-head{padding:15px 14px}.appointment-day-head h2{font-size:1.25rem}.appointment-list{padding:9px;gap:8px}.appointment-item{grid-template-columns:74px minmax(0,.9fr) minmax(0,1.1fr) 38px;gap:8px;min-height:92px;padding:12px 8px 12px 13px;border-radius:13px}.appointment-time strong{font-size:1.25rem}.appointment-time span{font-size:.68rem}.appointment-with,.appointment-client{padding-left:9px}.appointment-with strong,.appointment-client strong{font-size:.79rem}.appointment-with span,.appointment-client span{font-size:.68rem}.appointment-call{width:36px;height:36px;border-radius:10px}.appointment-item-actions{display:none}

`;

function appointmentThemeInit(){
  const saved=localStorage.getItem('studio47_admin_theme')||'light';
  document.documentElement.dataset.theme=saved;
}
appointmentThemeInit();
function installThemeToggle(){
  const actions=document.querySelector('.top-actions');if(!actions||document.querySelector('#themeToggle'))return;
  const btn=document.createElement('button');btn.type='button';btn.className='icon-btn';btn.id='themeToggle';btn.setAttribute('aria-label','Toggle light and dark mode');
  const paint=()=>{const dark=document.documentElement.dataset.theme==='dark';btn.innerHTML=`<i class="fa-solid ${dark?'fa-sun':'fa-moon'}"></i>`;btn.title=dark?'Use light mode':'Use dark mode'};
  btn.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('studio47_admin_theme',next);paint()};
  const translator=document.querySelector('.translator');actions.insertBefore(btn,translator||actions.firstChild);paint();
}
const appBeforeAppointmentTheme=app;
app=function(){appBeforeAppointmentTheme();installThemeToggle()};

const formatClock=value=>{const raw=String(value||'00:00').slice(0,5),[hh,mm]=raw.split(':').map(Number),hour=((hh+11)%12)+1,ampm=hh>=12?'PM':'AM';return {time:`${hour}:${String(mm).padStart(2,'0')}`,ampm}};
const formatDayHeading=date=>new Date(`${date}T12:00:00`).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});

appointmentsManager=function(){
  const stylists=[...new Set(data.appointments.map(x=>x.stylist).filter(Boolean))].sort(),types=[...new Set(data.appointments.map(x=>x.service_type).filter(Boolean))].sort();
  document.querySelector('#view').innerHTML=`<section class="appointment-page"><div class="appointment-page-head"><div class="appointment-title"><div class="eyebrow">Schedule</div><h1>Appointments</h1><p>View and manage your upcoming appointments.</p></div><div class="appointment-head-actions"><div class="appointment-filter-wrap"><button class="appointment-filter-trigger-new" id="appointmentFilterButton" type="button" aria-expanded="false" aria-haspopup="dialog"><i class="fa-solid fa-sliders"></i><span>Filter</span></button><div class="studio47-filter-modal" id="appointmentFilterPanel" role="dialog" aria-modal="true" aria-labelledby="appointmentFilterTitle" hidden><input id="appointmentDay" type="date" aria-label="Date"><select id="appointmentStylist"><option value="">All stylists</option>${stylists.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="appointmentType"><option value="">All services</option>${types.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="appointmentStatus"><option value="">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option></select><select id="appointmentSort"><option value="asc">Soonest first</option><option value="desc">Latest first</option></select><button class="filter-reset" id="appointmentFilterReset" type="button">Reset filters</button></div></div><button class="appointment-add-btn" id="addAppointment" type="button" aria-label="Set appointment"><i class="fa-solid fa-plus"></i></button></div></div><div class="appointment-groups" id="appointmentRows"></div></section>`;
  const panel=document.querySelector('#appointmentFilterPanel'),button=document.querySelector('#appointmentFilterButton');
  button.onclick=()=>{const open=panel.hidden;panel.hidden=!open;button.setAttribute('aria-expanded',String(open))};
  document.querySelector('#addAppointment').onclick=()=>appointmentEditor();
  ['appointmentDay','appointmentStylist','appointmentType','appointmentStatus','appointmentSort'].forEach(id=>document.querySelector('#'+id).onchange=renderAppointmentRows);
  document.querySelector('#appointmentFilterReset').onclick=()=>{['appointmentDay','appointmentStylist','appointmentType','appointmentStatus'].forEach(id=>document.querySelector('#'+id).value='');document.querySelector('#appointmentSort').value='asc';renderAppointmentRows()};
  renderAppointmentRows();
};

renderAppointmentRows=function(){
  const get=id=>document.querySelector('#'+id)?.value||'',day=get('appointmentDay'),stylist=get('appointmentStylist'),type=get('appointmentType'),status=get('appointmentStatus'),sort=get('appointmentSort')||'asc';
  let rows=data.appointments.filter(a=>(!day||a.appointment_date===day)&&(!stylist||a.stylist===stylist)&&(!type||a.service_type===type)&&(!status||(a.status||'pending')===status)).sort((a,b)=>(appointmentDateTime(a)-appointmentDateTime(b))*(sort==='asc'?1:-1));
  const host=document.querySelector('#appointmentRows');if(!host)return;
  if(!rows.length){host.innerHTML='<div class="appointment-empty">No appointments match these filters.</div>';return}
  const groups=new Map();rows.forEach(a=>{if(!groups.has(a.appointment_date))groups.set(a.appointment_date,[]);groups.get(a.appointment_date).push(a)});
  host.innerHTML=[...groups.entries()].map(([date,items])=>`<section class="appointment-day"><header class="appointment-day-head"><i class="fa-regular fa-calendar"></i><h2>${esc(formatDayHeading(date))}</h2><span class="appointment-day-count">${items.length}</span></header><div class="appointment-list">${items.map(a=>{const clock=formatClock(a.appointment_time),state=a.status||'pending';return `<article class="appointment-item"><div class="appointment-time"><strong>${esc(clock.time)}</strong><span>${clock.ampm}</span></div><div class="appointment-with"><strong>With ${esc(a.stylist||'No preference')}</strong><span>${esc(a.service_type||'Appointment')}</span></div><div class="appointment-client"><strong>${esc(a.client_name||'Client')}</strong><span>${esc(a.phone||'No phone')}</span></div><a class="appointment-call" href="tel:${esc(a.phone||'')}" aria-label="Call ${esc(a.client_name||'client')}"><i class="fa-solid fa-phone"></i></a><details class="appointment-item-actions"><summary><i class="fa-solid fa-ellipsis"></i></summary><div class="appointment-action-menu"><button type="button" onclick="appointmentEditor(data.appointments.find(x=>x.id==='${a.id}'))">Edit</button>${state!=='confirmed'?`<button type="button" onclick="appointmentStatus('${a.id}','confirmed')">Confirm</button>`:''}${state!=='cancelled'?`<button type="button" onclick="appointmentStatus('${a.id}','cancelled')">Cancel</button>`:''}<button type="button" class="delete" onclick="removeAppointment('${a.id}')">Delete</button></div></details></article>`}).join('')}</div></section>`).join('');
};

// Startup runs after all dashboard enhancements are defined.
</script>
<script>
/* ===== Appointment UX improvements: calendar picker, Apple-style time wheels, team-aware filtering ===== */
(() => {
  const extraStyles = document.createElement('style');
  extraStyles.textContent = `
  .picker-field{
    width:100%;min-height:48px;padding:0 13px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:space-between;
    gap:12px;text-align:left;font-weight:750;
  }
  .picker-field .picker-placeholder{color:var(--muted);font-weight:650}
  .picker-field i{color:var(--pink)}
  html[data-theme="dark"] .picker-field{background:#191216;color:#fff5fa;border-color:#55313f}

  .native-date-proxy{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}

  .time-picker-sheet{
    position:fixed;inset:auto 0 0;z-index:95;padding:18px 14px max(18px,env(safe-area-inset-bottom));
    background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -24px 65px #3a122b38;
  }
  .time-picker-backdrop{position:fixed;inset:0;z-index:94;background:#1e08148c;border:0}
  .time-picker-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
  .time-picker-top strong{font:400 1.35rem Georgia,serif}
  .time-picker-top button{border:0;background:transparent;color:var(--pink);font-weight:900;padding:8px}
  .time-wheels{
    position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;height:230px;
    overflow:hidden;max-width:520px;margin:0 auto;
  }
  .time-wheels:before,.time-wheels:after{
    content:"";position:absolute;left:0;right:0;height:82px;z-index:3;pointer-events:none;
  }
  .time-wheels:before{top:0;background:linear-gradient(#fff,rgba(255,255,255,.88),rgba(255,255,255,0))}
  .time-wheels:after{bottom:0;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.88),#fff)}
  .time-wheel-highlight{
    position:absolute;left:0;right:0;top:91px;height:48px;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);background:var(--blush);z-index:0;border-radius:8px;
  }
  .time-wheel{
    position:relative;z-index:1;overflow-y:auto;scroll-snap-type:y mandatory;
    scrollbar-width:none;padding:91px 0;
  }
  .time-wheel::-webkit-scrollbar{display:none}
  .time-wheel button{
    width:100%;height:48px;border:0;background:transparent;color:var(--ink);
    scroll-snap-align:center;font-size:1.35rem;font-weight:700;
  }
  .time-wheel button.selected{color:var(--pink);font-weight:900}
  html[data-theme="dark"] .time-picker-sheet{background:#151014;color:#fff}
  html[data-theme="dark"] .time-wheels:before{background:linear-gradient(#151014,rgba(21,16,20,.9),rgba(21,16,20,0))}
  html[data-theme="dark"] .time-wheels:after{background:linear-gradient(rgba(21,16,20,0),rgba(21,16,20,.9),#151014)}
  html[data-theme="dark"] .time-wheel-highlight{background:#281722;border-color:#55313f}
  html[data-theme="dark"] .time-wheel button{color:#fff5fa}

  .appointment-section-label{
    margin:3px 2px 10px;color:var(--pink);font-size:.69rem;font-weight:950;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .appointment-today-empty{
    padding:27px 18px;border:1px dashed var(--line);border-radius:16px;background:#fff;
    color:var(--muted);text-align:center;margin-bottom:18px;
  }
  html[data-theme="dark"] .appointment-today-empty{background:#151014;border-color:#55313f}

  @media(min-width:761px){
    .time-picker-sheet{
      left:50%;right:auto;bottom:50%;transform:translate(-50%,50%);
      width:min(560px,calc(100vw - 36px));border-radius:22px;padding:22px;
    }
    .time-picker-backdrop{background:#1e081475}
  }
  `;
  document.head.appendChild(extraStyles);

  const pad2 = n => String(n).padStart(2,'0');

  function datePretty(value){
    if(!value) return 'Choose date';
    return new Date(`${value}T12:00:00`).toLocaleDateString('en-US',{
      weekday:'long',month:'short',day:'numeric',year:'numeric'
    });
  }

  function timePretty(value){
    if(!value) return 'Choose time';
    const [h,m] = String(value).slice(0,5).split(':').map(Number);
    const hour = ((h+11)%12)+1;
    return `${hour}:${pad2(m)} ${h>=12?'PM':'AM'}`;
  }

  function openDatePicker(button, hiddenInput){
    if(typeof hiddenInput.showPicker === 'function'){
      hiddenInput.showPicker();
    }else{
      hiddenInput.focus();
      hiddenInput.click();
    }
  }

  function makePickerButton({label, value, icon, id}){
    return `<button type="button" class="picker-field" id="${id}">
      <span class="${value?'':'picker-placeholder'}">${esc(label)}</span>
      <i class="fa-solid ${icon}"></i>
    </button>`;
  }

  window.openWheelTimePicker = function(currentValue, onDone){
    const [rawH,rawM] = String(currentValue||'09:00').split(':').map(Number);
    let hour12=((rawH+11)%12)+1, minute=[0,15,30,45].reduce((a,b)=>Math.abs(b-rawM)<Math.abs(a-rawM)?b:a,0), meridiem=rawH>=12?'PM':'AM';

    const hourOptions = Array.from({length:12},(_,i)=>i+1);
    const minuteOptions = [0,15,30,45];
    const ampmOptions = ['AM','PM'];

    const overlayEl=document.querySelector('#overlay');
    const previous=overlayEl.innerHTML;
    overlayEl.innerHTML=`
      <button class="time-picker-backdrop" id="timeBackdrop" aria-label="Close time picker"></button>
      <div class="time-picker-sheet" role="dialog" aria-modal="true" aria-label="Choose time">
        <div class="time-picker-top">
          <button type="button" id="timeCancel">Cancel</button>
          <strong>Choose time</strong>
          <button type="button" id="timeDone">Done</button>
        </div>
        <div class="time-wheels">
          <div class="time-wheel-highlight"></div>
          <div class="time-wheel" id="hourWheel">${hourOptions.map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div>
          <div class="time-wheel" id="minuteWheel">${minuteOptions.map(v=>`<button type="button" data-v="${v}">${pad2(v)}</button>`).join('')}</div>
          <div class="time-wheel" id="ampmWheel">${ampmOptions.map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div>
        </div>
      </div>`;

    const close=()=>overlayEl.innerHTML=previous;
    document.querySelector('#timeCancel').onclick=close;
    document.querySelector('#timeBackdrop').onclick=close;

    const configure=(id,initial,setter)=>{
      const wheel=document.querySelector('#'+id), buttons=[...wheel.querySelectorAll('button')];
      const choose=button=>{
        buttons.forEach(b=>b.classList.toggle('selected',b===button));
        setter(button.dataset.v);
      };
      buttons.forEach(button=>button.onclick=()=>{button.scrollIntoView({block:'center',behavior:'smooth'});choose(button)});
      const selected=buttons.find(b=>String(b.dataset.v)===String(initial))||buttons[0];
      setTimeout(()=>{selected.scrollIntoView({block:'center'});choose(selected)},20);

      let timer;
      wheel.addEventListener('scroll',()=>{
        clearTimeout(timer);
        timer=setTimeout(()=>{
          const box=wheel.getBoundingClientRect(), center=box.top+box.height/2;
          let best=buttons[0],dist=Infinity;
          buttons.forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs((r.top+r.height/2)-center);if(d<dist){dist=d;best=b}});
          choose(best);
        },80);
      });
    };

    configure('hourWheel',hour12,v=>hour12=Number(v));
    configure('minuteWheel',minute,v=>minute=Number(v));
    configure('ampmWheel',meridiem,v=>meridiem=v);

    document.querySelector('#timeDone').onclick=()=>{
      let h=hour12%12;if(meridiem==='PM')h+=12;
      const value=`${pad2(h)}:${pad2(minute)}`;
      close();onDone(value);
    };
  };

  const oldAppointmentEditor = window.appointmentEditor;
  window.appointmentEditor = function(a={}){
    oldAppointmentEditor(a);

    const form=document.querySelector('#appointmentEdit');
    if(!form) return;

    const dateInput=form.querySelector('input[name="appointment_date"]');
    const timeInput=form.querySelector('input[name="appointment_time"]');
    if(!dateInput || !timeInput) return;

    dateInput.classList.add('native-date-proxy');
    timeInput.type='hidden';

    const dateButtonWrap=document.createElement('div');
    dateButtonWrap.className='field';
    dateButtonWrap.innerHTML=`<label>Date</label>${makePickerButton({
      label:datePretty(dateInput.value),value:dateInput.value,icon:'fa-calendar-days',id:'appointmentDateButton'
    })}`;
    dateInput.closest('.field').replaceWith(dateButtonWrap);
    dateButtonWrap.appendChild(dateInput);

    const timeButtonWrap=document.createElement('div');
    timeButtonWrap.className='field';
    timeButtonWrap.innerHTML=`<label>Time</label>${makePickerButton({
      label:timePretty(timeInput.value),value:timeInput.value,icon:'fa-clock',id:'appointmentTimeButton'
    })}`;
    timeInput.closest('.field').replaceWith(timeButtonWrap);
    timeButtonWrap.appendChild(timeInput);

    const dateButton=document.querySelector('#appointmentDateButton');
    const timeButton=document.querySelector('#appointmentTimeButton');

    dateButton.onclick=()=>openDatePicker(dateButton,dateInput);
    dateInput.onchange=()=>{
      dateButton.querySelector('span').textContent=datePretty(dateInput.value);
      dateButton.querySelector('span').classList.toggle('picker-placeholder',!dateInput.value);
    };

    timeButton.onclick=()=>openWheelTimePicker(timeInput.value,value=>{
      timeInput.value=value;
      timeButton.querySelector('span').textContent=timePretty(value);
      timeButton.querySelector('span').classList.remove('picker-placeholder');
    });
  };

  const previousAppointmentsManager = window.appointmentsManager;
  window.appointmentsManager = function(){
    previousAppointmentsManager();

    // Always show every actual team member in the filter, even when they have zero appointments.
    const select=document.querySelector('#appointmentStylist');
    if(select){
      const current=select.value;
      select.innerHTML=`<option value="">All team members</option>${data.team
        .slice()
        .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))
        .map(member=>`<option value="${esc(member.name)}">${esc(member.name)}</option>`).join('')}`;
      select.value=current;
      select.onchange=renderAppointmentRows;
    }
  };

  window.renderAppointmentRows = function(){
    const get=id=>document.querySelector('#'+id)?.value||'';
    const day=get('appointmentDay'),stylist=get('appointmentStylist'),type=get('appointmentType'),
          status=get('appointmentStatus'),sort=get('appointmentSort')||'asc';

    let rows=data.appointments.filter(a=>
      (!day||a.appointment_date===day)&&
      (!stylist||a.stylist===stylist)&&
      (!type||a.service_type===type)&&
      (!status||(a.status||'pending')===status)
    ).sort((a,b)=>(appointmentDateTime(a)-appointmentDateTime(b))*(sort==='asc'?1:-1));

    const host=document.querySelector('#appointmentRows');if(!host)return;

    const today=new Date();
    const todayKey=`${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;

    const card = (a)=>{
      const clock=formatClock(a.appointment_time),state=a.status||'pending';
      return `<article class="appointment-item">
        <div class="appointment-time"><strong>${esc(clock.time)}</strong><span>${clock.ampm}</span></div>
        <div class="appointment-with"><strong>With ${esc(a.stylist||'No preference')}</strong><span>${esc(a.service_type||'Appointment')}</span></div>
        <div class="appointment-client"><strong>${esc(a.client_name||'Client')}</strong><span>${esc(a.phone||'No phone')}</span></div>
        <a class="appointment-call" href="tel:${esc(a.phone||'')}" aria-label="Call ${esc(a.client_name||'client')}"><i class="fa-solid fa-phone"></i></a>
        <details class="appointment-item-actions"><summary><i class="fa-solid fa-ellipsis"></i></summary>
          <div class="appointment-action-menu">
            <button type="button" onclick="appointmentEditor(data.appointments.find(x=>x.id==='${a.id}'))">Edit</button>
            ${state!=='confirmed'?`<button type="button" onclick="appointmentStatus('${a.id}','confirmed')">Confirm</button>`:''}
            ${state!=='cancelled'?`<button type="button" onclick="appointmentStatus('${a.id}','cancelled')">Cancel</button>`:''}
            <button type="button" class="delete" onclick="removeAppointment('${a.id}')">Delete</button>
          </div>
        </details>
      </article>`;
    };

    const dayGroup=(date,items)=>`<section class="appointment-day">
      <header class="appointment-day-head">
        <i class="fa-regular fa-calendar"></i>
        <h2>${esc(formatDayHeading(date))}</h2>
        <span class="appointment-day-count">${items.length}</span>
      </header>
      <div class="appointment-list">${items.map(card).join('')}</div>
    </section>`;

    // A specific date filter should continue to show only that date.
    if(day){
      if(!rows.length){host.innerHTML='<div class="appointment-empty">No appointments on this day.</div>';return}
      host.innerHTML=dayGroup(day,rows);
      return;
    }

    const todayRows=rows.filter(a=>a.appointment_date===todayKey);
    const futureRows=rows.filter(a=>a.appointment_date>todayKey);
    const olderRows=rows.filter(a=>a.appointment_date<todayKey);

    const futureGroups=new Map();
    futureRows.forEach(a=>{if(!futureGroups.has(a.appointment_date))futureGroups.set(a.appointment_date,[]);futureGroups.get(a.appointment_date).push(a)});

    let html=`<div class="appointment-section-label">Today</div>`;
    html+=todayRows.length?dayGroup(todayKey,todayRows):`<div class="appointment-today-empty">No appointments today${stylist?` for ${esc(stylist)}`:''}.</div>`;

    html+=`<div class="appointment-section-label">Future appointments${stylist?` · ${esc(stylist)}`:''}</div>`;
    html+=futureRows.length
      ? [...futureGroups.entries()].map(([date,items])=>dayGroup(date,items)).join('')
      : `<div class="appointment-today-empty">No future appointments${stylist?` for ${esc(stylist)}`:''}.</div>`;

    if(sort==='desc' && olderRows.length){
      const oldGroups=new Map();
      olderRows.forEach(a=>{if(!oldGroups.has(a.appointment_date))oldGroups.set(a.appointment_date,[]);oldGroups.get(a.appointment_date).push(a)});
      html+=`<div class="appointment-section-label">Past appointments</div>${[...oldGroups.entries()].map(([date,items])=>dayGroup(date,items)).join('')}`;
    }

    host.innerHTML=html;
  };
})();
</script>


<script>
/* ===== Mobile appointment layout + expandable appointment details ===== */
(() => {
  const mobileAppointmentStyles=document.createElement('style');
  mobileAppointmentStyles.textContent=`
  .appointment-item{
    cursor:pointer;
    grid-template-columns:105px minmax(180px,.9fr) minmax(220px,1.1fr) 44px;
    transition:border-color .18s,box-shadow .18s,transform .18s;
  }

    position:absolute;right:11px;bottom:10px;width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;color:#b76b8d;background:transparent;transition:transform .2s;
  }

itted</div><h2>Recent requests</h2></div><span>${requests.length}</span></div><div class="help-request-list">${requests.length?requests.map(request=>`<article class="help-request-card"><div class="help-request-top"><span class="help-request-kind ${request.request_type==='bug'?'bug':'request'}"><i class="fa-solid ${request.request_type==='bug'?'fa-bug':'fa-wand-magic-sparkles'}"></i>${request.request_type==='bug'?'Bug':'Request'}</span><span class="help-priority ${esc(request.priority||'normal')}">${esc(request.priority||'normal')}</span></div><h3>${esc(request.subject||request.title||'Request')}</h3><p>${esc(request.details||'')}</p><small>${esc(request.page||'Website')} · ${request.created_at?new Date(request.created_at).toLocaleString():'Submitted'}</small></article>`).join(''):'<div class="help-empty"><i class="fa-regular fa-circle-check"></i><strong>No requests yet</strong><span>New submissions will appear here.</span></div>'}</div></aside></div></section>`;

async function submitHelpRequest(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),message=document.querySelector('#helpMessage'),fields=Object.fromEntries(new FormData(form)),request={request_type:fields.request_type,priority:fields.priority,page:fields.page,subject:String(fields.subject||'').trim(),details:String(fields.details||'').trim(),status:'new',submitted_by:session?.user?.email||'',submitted_at:new Date().toISOString(),source_site:'Studio 47',source_url:location.origin+location.pathname,browser:navigator.userAgent};if(!request.subject||!request.details)return;button.disabled=true;message.className='help-message';message.textContent='Sending…';const {data:remoteId,error}=await requestDb.rpc('submit_website_request',{p_request_type:request.request_type,p_priority:request.priority,p_page:request.page,p_subject:request.subject,p_details:request.details,p_submitted_by:request.submitted_by,p_source_site:request.source_site,p_source_url:request.source_url,p_browser:request.browser});if(error){button.disabled=false;message.className='help-message error';message.textContent=error.message;return}request.remote_id=remoteId;const {error:localError}=await db.from('site_content').insert({section:'website_requests',content_key:`website_request_${Date.now()}`,content_value:JSON.stringify(request),title:request.subject,image_url:'',sort_order:0,is_live:false});if(localError){button.disabled=false;message.className='help-message error';message.textContent='Sent to dashboard, but recent requests could not update: '+localError.message;return}form.reset();message.className='help-message success';message.textContent='Your request was sent.';toast('Request sent');await load()}
async function deleteHelpRequest(localId,remoteId){if(!confirm('Delete this request?'))return;if(remoteId){const {error}=await requestDb.rpc('delete_website_request',{p_request_id:remoteId});if(error)return alert(error.message)}const {error}=await db.from('site_content').delete().eq('id',localId);if(error)return alert(error.message);toast('Request deleted');await load()}

boot();

<script>
/* Persistent team ordering. Requires the reorder_team_member SQL function. */
const orderedTeam=()=>[...(data.team||[])].sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.id).localeCompare(String(b.id)));
async function moveTeamMember(id,direction){
  const {error}=await db.rpc('reorder_team_member',{p_member_id:id,p_direction:direction});
  if(error)return alert(`Team order could not be updated: ${error.message}`);
  toast('Team order updated');
  await load();
}
teamManager=function(){
  const team=orderedTeam();
  document.querySelector('#view').innerHTML=`<section class="page-head"><div><div class="eyebrow">Staff schedule</div><h1>Team</h1><p>Manage team members, schedules, and the order shown to clients.</p></div><button class="primary" id="addTeam"><i class="fa-solid fa-plus"></i> Add team member</button></section><article class="card"><div class="table-wrap">${team.length?`<table><thead><tr><th>Order</th><th>Name</th><th>Working days</th><th>Hours</th><th>Actions</th></tr></thead><tbody>${team.map((member,index)=>`<tr><td><div class="row-actions"><button class="ghost" type="button" onclick="moveTeamMember('${member.id}',-1)" aria-label="Move ${esc(member.name)} up" ${index===0?'disabled':''}>↑</button><button class="ghost" type="button" onclick="moveTeamMember('${member.id}',1)" aria-label="Move ${esc(member.name)} down" ${index===team.length-1?'disabled':''}>↓</button></div></td><td><strong>${esc(member.name)}</strong></td><td>${(member.working_days||[]).map(day=>weekDays[Number(day)].slice(0,3)).join(', ')||'No days selected'}</td><td>${esc(member.start_time||'—')} – ${esc(member.end_time||'—')}</td><td><div class="row-actions"><button class="ghost" type="button" onclick="teamEditor(data.team.find(item=>item.id==='${member.id}'))">Edit</button><button class="danger" type="button" onclick="removeTeam('${member.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No team members yet.</div>'}</div></article>`;
  document.querySelector('#addTeam').onclick=()=>teamEditor();
};

load=async function(note=false){
  const requestId=++accessLoadSequence;
  const profileResult=await db.from('staff_profiles').select('user_id,work_email,recovery_email,stylist_name,team_member_id,role,active').eq('user_id',session.user.id).maybeSingle();
  if(requestId!==accessLoadSequence)return;
  if(profileResult.error||!profileResult.data?.active){document.querySelector('#view').innerHTML='<div class="page-head"><div><div class="eyebrow">Access</div><h1>Account not linked</h1><p>Ask Maria Elena to link this login to an active team member.</p></div></div>';return}
  staffProfile=profileResult.data;
  const reviewRequest=(async()=>{
    const liveGoogleReviews=await db.functions.invoke('google-reviews',{body:{}});
    if(!liveGoogleReviews.error)return liveGoogleReviews;
    console.warn('Live Google reviews are unavailable; loading saved reviews instead.',liveGoogleReviews.error);
    const savedReviews=await db.from('reviews').select('*').order('created_at',{ascending:false});
    if(savedReviews.error)return savedReviews;
    return {data:{reviews:savedReviews.data||[],place:null,fetched_at:null},error:null};
  })();
  const queries=[db.from('site_content').select('*').order('sort_order'),db.from('services').select('*').order('sort_order'),reviewRequest,db.from('appointments').select('*').order('appointment_date').order('appointment_time')];
  if(isOwner())queries.push(db.from('staff_profiles').select('user_id,work_email,recovery_email,stylist_name,team_member_id,role,active').order('stylist_name'));
  const results=await Promise.all(queries),error=results.find(result=>result.error)?.error;if(error){document.querySelector('#view').innerHTML=`<div class="page-head"><div><div class="eyebrow">Access</div><h1>Unable to load data</h1><p>${esc(error.message)}</p></div></div>`;return}
  if(requestId!==accessLoadSequence)return;
  const team=results[0].data.filter(item=>item.section==='team').map(item=>{try{return {...JSON.parse(item.content_value||'{}'),id:item.id,content_key:item.content_key,sort_order:item.sort_order}}catch{return null}}).filter(Boolean);
  data={content:results[0].data,services:results[1].data,reviews:results[2].data?.reviews||[],googlePlace:results[2].data?.place||null,reviewsFetchedAt:results[2].data?.fetched_at||null,appointments:results[3].data,team,staffProfiles:results[4]?.data||[staffProfile]};
  const badge=document.querySelector('#badge');if(badge)badge.hidden=true;render();if(note)toast('Dashboard refreshed');
};

const notificationStorageKey=()=>`studio47_seen_notifications_${session?.user?.id||'guest'}`;
function readNotificationState(){try{return JSON.parse(localStorage.getItem(notificationStorageKey())||'{"appointments":[],"reviews":[]')}catch{return {appointments:[],reviews:[]}}}
function writeNotificationState(state){localStorage.setItem(notificationStorageKey(),JSON.stringify({appointments:[...(state.appointments||[])].slice(-500),reviews:[...(state.reviews||[])].slice(-500)}))}
function notificationItems(type){return type==='appointments'?(data.appointments||[]):(data.reviews||[])}
function unreadNotificationCount(type){const seen=new Set(readNotificationState()[type]||[]);return notificationItems(type).filter(item=>!seen.has(notificationRecordKey(type,item))).length}
function markNotificationsSeen(type){const state=readNotificationState();state[type]=[...new Set([...(state[type]||[]),...notificationItems(type).map(item=>notificationRecordKey(type,item))])];writeNotificationState(state);refreshNotificationCounts()}
function notificationCountLabel(count){return count>99?'99+':String(count)}
function refreshNotificationCounts(){

  const counts={appointments:unreadNotificationCount('appointments'),reviews:unreadNotificationCount('reviews')};
  document.querySelectorAll('[data-notification-badge]').forEach(badge=>{const count=counts[badge.dataset.notificationBadge]||0;badge.textContent=notificationCountLabel(count);badge.hidden=!count});
  const total=counts.appointments+counts.reviews,totalBadge=document.querySelector('.notification-total');if(totalBadge){totalBadge.textContent=notificationCountLabel(total);totalBadge.hidden=!total}

<script id="studio47-rebuilt-filter-controller">
(() => {
  const previousAppointmentsManager = window.appointmentsManager;

  function removeOldDetachedFilter(){
    document.querySelectorAll('body > #appointmentFilterPanel').forEach(el => el.remove());
    document.querySelectorAll('.appointment-filter-backdrop,#studio47FilterBackdrop').forEach(el => el.remove());
  }

  window.appointmentsManager = function(){
    removeOldDetachedFilter();
    previousAppointmentsManager.apply(this, arguments);

    const oldButton = document.querySelector('#appointmentFilterButton');
    const panel = document.querySelector('#appointmentFilterPanel');
    if(!oldButton || !panel) return;

    /* Completely replace the old trigger node so none of its old handlers/styles survive. */
    const freshButton = document.createElement('button');
    freshButton.type = 'button';
    freshButton.id = 'appointmentFilterButton';
    freshButton.className = 'appointment-filter-trigger-new';
    freshButton.setAttribute('aria-expanded','false');
    freshButton.setAttribute('aria-haspopup','dialog');
    freshButton.innerHTML = '<i class="fa-solid fa-sliders"></i><span>Filter</span>';
    oldButton.replaceWith(freshButton);

    /* Remove the old mobile-filter backdrop/controller artifacts. */
    document.querySelectorAll('.appointment-filter-backdrop').forEach(el => el.remove());

    panel.classList.remove('appointment-filter-panel');
    panel.classList.add('studio47-filter-modal');
    panel.setAttribute('role','dialog');
    panel.setAttribute('aria-modal','true');

    /* Rebuild the modal header cleanly so duplicate enhancement passes cannot stack it. */
    panel.querySelectorAll('.appointment-filter-head').forEach(el => el.remove());
    const head = document.createElement('div');
    head.className = 'appointment-filter-head';
    head.innerHTML = '<strong id="appointmentFilterTitle">Filter appointments</strong><button class="appointment-filter-close" type="button" aria-label="Close filters"><i class="fa-solid fa-xmark"></i></button>';
    panel.prepend(head);
    panel.setAttribute('aria-labelledby','appointmentFilterTitle');

    /* Ensure there is exactly one footer action group. */
    let actions = panel.querySelector('.appointment-filter-actions');
    const reset = panel.querySelector('#appointmentFilterReset');
    if(!actions){
      actions = document.createElement('div');
      actions.className = 'appointment-filter-actions';
      if(reset) reset.before(actions);
    }
    actions.querySelectorAll('.appointment-filter-done').forEach(el => el.remove());
    if(reset && reset.parentElement !== actions) actions.appendChild(reset);
    const done = document.createElement('button');
    done.type = 'button';
    done.className = 'appointment-filter-done';
    done.textContent = 'Done';
    actions.appendChild(done);

    /* Put the popup at document level so parent widths can never collapse it again. */
    document.body.appendChild(panel);
    panel.hidden = true;

    const backdrop = document.createElement('button');
    backdrop.type = 'button';
    backdrop.id = 'studio47FilterBackdrop';
    backdrop.className = 'studio47-filter-backdrop';
    backdrop.setAttribute('aria-label','Close filters');
    backdrop.hidden = true;
    document.body.appendChild(backdrop);

    const close = () => {
      panel.hidden = true;
      backdrop.hidden = true;
      freshButton.setAttribute('aria-expanded','false');
      document.body.style.overflow = '';
      freshButton.focus({preventScroll:true});
    };

    const open = () => {
      panel.hidden = false;
      backdrop.hidden = false;
      freshButton.setAttribute('aria-expanded','true');
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => panel.querySelector('.appointment-filter-close')?.focus({preventScroll:true}));
    };

    freshButton.onclick = open;
    backdrop.onclick = close;
    panel.querySelector('.appointment-filter-close').onclick = close;
    done.onclick = close;

    const onEscape = event => {
      if(event.key === 'Escape' && !panel.hidden){
        event.preventDefault();
        close();
      }
    };
    document.addEventListener('keydown', onEscape, {once:false});
  };
})();
</script>

<script id="studio47-mobile-ux-behavior">
(() => {
  let bodyScrollY=0;
  const popupSelector='.modal-bg:not([hidden]), .time-picker-backdrop:not([hidden]), .studio47-filter-backdrop:not([hidden])';
  const hasOpenPopup=()=>!!document.querySelector(popupSelector);
  const lockBody=()=>{
    if(document.body.dataset.popupLocked==='1') return;
    bodyScrollY=window.scrollY||0;
    document.body.dataset.popupLocked='1';
    document.body.style.setProperty('--locked-scroll-y',`${bodyScrollY}px`);
    document.body.style.overflow='hidden';
    document.body.style.overscrollBehavior='none';
  };
  const unlockBody=()=>{
    if(hasOpenPopup()) return;
    if(document.body.dataset.popupLocked!=='1') return;
    delete document.body.dataset.popupLocked;
    document.body.style.overflow='';
    document.body.style.overscrollBehavior='';
  };
  const keepFieldVisible=e=>{
    const field=e.target;
    if(!field.matches('input,select,textarea')) return;
    const popup=field.closest('.modal,.time-picker-sheet,.calendar-picker-sheet,.studio47-filter-modal');
    if(!popup) return;
    setTimeout(()=>field.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}),120);
  };
  document.addEventListener('focusin',keepFieldVisible,true);

  const observer=new MutationObserver(()=>{
    requestAnimationFrame(()=>{
      if(hasOpenPopup()) lockBody(); else unlockBody();
      document.querySelectorAll('.modal,.time-picker-sheet,.calendar-picker-sheet,.studio47-filter-modal').forEach(popup=>{
        popup.setAttribute('tabindex','-1');
        popup.style.webkitOverflowScrolling='touch';
      });
    });
  });
  observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class','style']});

  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    const top=[...document.querySelectorAll('.modal-bg:not([hidden])')].pop();
    if(top){ const close=top.querySelector('.close,.cancel,[aria-label*="Close"]'); close?.click(); }
  });
})();
</script>
